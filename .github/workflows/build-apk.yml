name: FaManga - Automatic APK Builder

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '**.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build FaManga Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Locate Project ZIP
        id: locate
        shell: bash
        run: |
          set -e

          ZIP=$(find . -type f \
            \( -iname 'famanga-mihon.zip' \
            -o -iname 'famanga-mihon*.zip' \) \
            | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "::error::ZIP tidak ditemukan. Upload famanga-mihon.zip ke repository."
            exit 1
          fi

          echo "ZIP ditemukan: $ZIP"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Extract Project
        run: |
          mkdir -p source
          unzip -q "${{ steps.locate.outputs.zip }}" -d source

      - name: Locate Gradle Project
        id: project
        shell: bash
        run: |
          set -e

          GRADLEW=$(find source -type f -name gradlew | head -n 1)

          if [ -z "$GRADLEW" ]; then
            echo "::error::gradlew tidak ditemukan dalam ZIP."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")

          echo "Project: $PROJECT_DIR"
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Release APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -Pdist=ci --no-daemon

      - name: Find APK
        id: apk
        shell: bash
        run: |
          set -e

          APK=$(find source -type f \
            -path '*/build/outputs/apk/*' \
            -name '*.apk' | head -n 1)

          if [ -z "$APK" ]; then
            echo "::error::APK tidak ditemukan."
            exit 1
          fi

          echo "APK berhasil dibuat: $APK"
          echo "path=$APK" >> "$GITHUB_OUTPUT"

      - name: Upload FaManga APK
        uses: actions/upload-artifact@v4
        with:
          name: FaManga-Android-APK
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 7
          
